body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}

.container{max-width:1200px;margin:0 auto;padding:0 16px}

.hero{border:1px solid var(--line);border-radius:20px;margin:18px 0;padding:58px 24px;text-align:center;background:url('banner.png') center/cover no-repeat}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:13px 22px;font-weight:700;letter-spacing:.6px;font-size:14px;transition:.2s}

main{padding-bottom:100px}
@media(max-width:900px){

/* ===== NUVEM (FIREBASE REALTIME DATABASE) ===== */
const FIREBASE_URL = "https://seu-estilo-51b83-default-rtdb.firebaseio.com";
function sbCfg(){
  return {url:FIREBASE_URL};
}

function sbConnected(){
  return true;
}

function fbBase(){
  return FIREBASE_URL;
}
async function cloudPull(silent){
 if(!sbConnected())return false;
 try{
  const [r1,r2]=await Promise.all([fetch(fbBase()+'/products.json'),fetch(fbBase()+'/orders.json')]);
  if(!r1.ok)throw new Error('products '+r1.status);
  const P=await r1.json();const O=r2.ok?await r2.json():null;
  if(P){const arr=Object.values(P).filter(Boolean);arr.sort((a,b)=>(a.id||0)-(b.id||0));localStorage.setItem('ss_products',JSON.stringify(arr))}
  if(O){const arr=Object.values(O).filter(Boolean);arr.sort((a,b)=>(b.ts||0)-(a.ts||0));localStorage.setItem('ss_orders',JSON.stringify(arr))}
  return true;
 }catch(e){console.warn('Nuvem:',e);if(!silent)toast('Nuvem indisponível — verifique a conexão',1);return false}
}
let _cloudPushT=null;
function cloudPush(k,v){
 if(!sbConnected())return;
 if(k!=='products'&&k!=='orders')return;
 clearTimeout(_cloudPushT);
 _cloudPushT=setTimeout(async()=>{
  try{
   const obj={};(v||[]).forEach(r=>{obj[r.id]=r});
   const res=await fetch(fbBase()+'/'+k+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
   if(!res.ok)console.warn('Push:',res.status);
  }catch(e){console.warn('Push:',e)}
 },400);
}

 else toast('Falha na conexão. Confira a URL do banco.',1);
}

 const P=products();const baixo=P.filter(p=>p.stock>0&&p.stock<=5).length;

 return `<div class="dcards">

function setStatus(id,st){
 const os=orders();const o=os.find(x=>x.id==id);if(!o)return;
 o.status=st;
 const hh=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 const labels={confirmado:'Pedido confirmado',vendido:'Pedido marcado como vendido',enviado:'Pedido enviado',finalizado:'Pedido finalizado',cancelado:'Pedido cancelado'};
 o.history.push({t:hh,label:labels[st]||st});
 if(st==='vendido'){
  const P=products();
  o.items.forEach(i=>{const p=P.find(x=>x.id==i.pid);if(p){p.stock=Math.max(0,p.stock-i.qty);p.sold=(p.sold||0)+i.qty}});
  DB.s('products',P);
 }
 DB.s('orders',os);toast('Status atualizado: '+STATUS[st]+' ✓');render();
}

function formImg(im,i){

function drawFimgs(){const el=$('#fimgs');if(el)el.innerHTML=fimgs.map(formImg).join('')||'<small style="color:var(--muted)">Nenhuma imagem adicionada ainda.</small>'}
function addFormImgs(inp){
 const files=[...inp.files];if(!files.length)return;
 let left=files.length;
 files.forEach(f=>{const r=new FileReader();r.onload=e=>{fimgs.push(e.target.result);if(--left===0)drawFimgs()};r.readAsDataURL(f)});
 inp.value='';
}
function setMainImg(i){const x=fimgs.splice(i,1)[0];fimgs.unshift(x);drawFimgs()}
function moveImg(i,d){const j=i+d;if(j<0||j>=fimgs.length)return;const t=fimgs[i];fimgs[i]=fimgs[j];fimgs[j]=t;drawFimgs()}
function rmImg(i){fimgs.splice(i,1);drawFimgs()}
function saveProd(edit,publish){
 const name=$('#p_name').value.trim(),price=parseFloat($('#p_price').value),stock=parseInt($('#p_stock').value||'0',10);
 if(!name)return toast('Informe o nome do produto.',1);
 if(!(price>0))return toast('Informe um preço válido.',1);
 if(!fimgs.length)return toast('Adicione pelo menos uma imagem.',1);
 const sizes=[...document.querySelectorAll('.fsz.on')].map(b=>b.textContent);
 if(!sizes.length)return toast('Selecione pelo menos um tamanho.',1);
 const data={name,cat:$('#p_cat').value.trim()||'Geral',price,
  old:parseFloat($('#p_old').value)||null,
  desc:$('#p_desc').value.trim(),
  sizes,
  colors:$('#p_colors').value.split(',').map(s=>s.trim()).filter(Boolean),
  stock:isNaN(stock)?0:Math.max(0,stock),
  imgs:[...fimgs],
  status:publish?$('#p_status').value:'inativo'};
 const P=products();
 if(edit){const p=P.find(x=>x.id==fedit);Object.assign(p,data);DB.s('products',P);toast('Produto atualizado ✓')}
 else{data.id=Math.max(0,...P.map(x=>x.id))+1;data.sold=0;P.unshift(data);DB.s('products',P);toast(publish?'Produto publicado na loja ✓':'Rascunho salvo ✓')}
 location.hash='#/admin/produtos';
}
function rAdmEstoque(){
 const P=products();
 return `<div class="panel"><table class="tbl resp">
 <thead><tr><th>Produto</th><th>Estoque atual</th><th>Vendidos</th><th>Status</th><th>Atualizar</th></tr></thead>
 <tbody>${P.map(p=>`<tr>
 <td data-l="PRODUTO"><div style="display:flex;align-items:center;gap:10px"><img src="${p.imgs[0]}" style="width:38px;height:38px;border-radius:8px;object-fit:cover"><span>${esc(p.name)}</span></div></td>
 <td data-l="ESTOQUE ATUAL"><b>${p.stock}</b></td>
 <td data-l="VENDIDOS">${p.sold||0}</td>
 <td data-l="STATUS"><span class="pill ${p.stock<1?'cancelado':(p.stock<=5?'confirmado':'vendido')}">${p.stock<1?'ESGOTADO':(p.stock<=5?'ESTOQUE BAIXO':'ESTOQUE NORMAL')}</span></td>
 <td data-l="ATUALIZAR"><div style="display:flex;gap:6px;align-items:center"><input class="in" style="width:84px;padding:8px 10px" type="number" min="0" id="st_${p.id}" value="${p.stock}"><button class="btn btn-o btn-sm" onclick="saveStock(${p.id})">SALVAR</button></div></td>
 </tr>`).join('')}</tbody></table></div>`;
}
function saveStock(id){
 const P=products();const p=P.find(x=>x.id==id);
 const v=parseInt($('#st_'+id).value,10);if(isNaN(v))return toast('Valor inválido.',1);
 p.stock=Math.max(0,v);DB.s('products',P);toast('Estoque atualizado ✓');render();
}
function rAdmClientes(){
 const os=orders();const map={};
 os.forEach(o=>{const k=o.customer.whats||o.customer.name;
  if(!map[k])map[k]={name:o.customer.name,whats:o.customer.whats,email:o.customer.email,cidade:o.customer.cidade,orders:[]};
  map[k].orders.push(o)});
 const list=Object.values(map);
 if(!list.length)return emptyState('Nenhum cliente cadastrado ainda. Os clientes aparecem aqui após o primeiro pedido.');
 return `<div class="panel"><table class="tbl resp">
 <thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Cidade</th><th>Pedidos</th><th>Total comprado</th><th>Último pedido</th></tr></thead>
 <tbody>${list.map(c=>{const tot=c.orders.reduce((a,o)=>a+o.total,0);const last=c.orders.slice().sort((a,b)=>b.ts-a.ts)[0];
 return `<tr><td data-l="NOME"><b>${esc(c.name)}</b></td><td data-l="TELEFONE">${esc(c.whats)}</td><td data-l="E-MAIL">${esc(c.email||'—')}</td>
 <td data-l="CIDADE">${esc(c.cidade||'—')}</td><td data-l="PEDIDOS">${c.orders.length}</td><td data-l="TOTAL">${fmt(tot)}</td>
 <td data-l="ÚLTIMO PEDIDO"><a href="#/admin/pedido/${last.id}" style="color:#fff">${last.num}</a> <span class="pill ${last.status}">${STATUS[last.status].toUpperCase()}</span></td></tr>`}).join('')}</tbody></table></div>`;
}
function rAdmConfig(){
 const s=DB.g('settings',{pass:'admin123'});
 const s2=sbCfg()||{};
 return `<div style="max-width:480px">
 <div class="field"><label>SENHA DO ADMINISTRADOR</label><input class="in" id="cfg_pass" value="${esc(s.pass)}"></div>
 <button class="btn btn-p" onclick="saveConfig()">SALVAR CONFIGURAÇÕES</button>
 <hr style="border:none;border-top:1px solid var(--line);margin:22px 0">
 <p style="color:var(--muted);font-size:13px;margin-bottom:12px">NUVEM (FIREBASE) — conecta a loja do cliente a este painel. Os dados passam a sincronizar entre os aparelhos.</p>
 <div class="field"><label>URL DO REALTIME DATABASE</label><input class="in" id="cfg_sburl" value="${esc(s2.url||'')}" placeholder="https://seuestilo-default-rtdb.firebaseio.com"></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-o" onclick="saveSb()">SALVAR CONEXÃO</button>
 <button class="btn btn-p" onclick="testSb()">TESTAR E SINCRONIZAR</button></div>
 <p style="color:var(--muted);font-size:12px;margin-top:10px">Status: <b style="color:#fff">${sbConnected()?'CONECTADO \u2601':'NÃO CONFIGURADO — dados só neste aparelho'}</b></p>
 <hr style="border:none;border-top:1px solid var(--line);margin:28px 0">
 <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Zona de perigo — apaga produtos, pedidos e clientes e restaura os dados de demonstração.</p>
 <button class="btn btn-d" onclick="confirmModal('Apagar TODOS os dados da loja e restaurar o demo?',resetAll)">ZERAR DADOS DA LOJA</button></div>`;
}
function saveConfig(){DB.s('settings',{pass:$('#cfg_pass').value.trim()||'admin123'});toast('Configurações salvas ✓')}
function resetAll(){localStorage.clear();sessionStorage.clear();location.hash='#/';location.reload()}
let modalCb=null;
function confirmModal(msg,cb){
 modalCb=cb;
 $('#modalBox').innerHTML=`<h3>Confirmação</h3><p>${msg}</p><div style="display:flex;gap:10px"><button class="btn btn-o" style="flex:1" onclick="closeModal()">CANCELAR</button><button class="btn btn-p" style="flex:1" onclick="yesModal()">CONFIRMAR</button></div>`;
 $('#modalWrap').style.display='flex';
}
function closeModal(){$('#modalWrap').style.display='none';modalCb=null}
function yesModal(){const cb=modalCb;closeModal();if(cb)cb()}
function toast(msg,err){
 const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;
 $('#toasts').appendChild(t);
 setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320)},2600);
}
function render(){
 const parts=(location.hash||'#/').replace(/^#\/?/,'').split('/');
 const page=parts[0]||'';const param=parts[1];
 window.scrollTo(0,0);
 if(page==='admin'){renderAdmin(param||'dashboard',parts[2]);return}
 switch(page){
  case '': app(storeLayout('#/',rHome()));break;
  case 'produtos': app(storeLayout('#/produtos',rProdutos()));break;
  case 'produto': app(storeLayout('#/produtos',rProduto(param)));break;
  case 'carrinho': app(storeLayout('#/carrinho',rCarrinho()));break;
  case 'checkout': app(storeLayout('#/carrinho',rCheckout()));break;
  case 'sucesso': app(storeLayout('#/pedidos',rSucesso()));break;
  case 'pedidos': app(storeLayout('#/pedidos',rMeusPedidos()));break;
  case 'perfil': app(storeLayout('#/perfil',rPerfil()));break;
  default: app(storeLayout('#/',rHome()));
 }
}
function app(h){$('#app').innerHTML=h}
window.addEventListener('hashchange',render);
(async()=>{
 const ok=await cloudPull(true);
 seedData(); render();
 if(ok&&sbConnected())toast('Sincronizado com a nuvem \u2601');
 if(sbConnected())setInterval(async()=>{
  const changed=await cloudPull(true);
  if(changed){const p=(location.hash||'').replace(/^#\/?/,'').split('/')[0];
   if(['dashboard','pedidos','estoque','clientes',''].includes(p))render();}
 },15000);
})();
</script>
</body>
</html>
